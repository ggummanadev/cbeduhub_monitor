<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>백년서원 강사 확인서</title>
    <meta name="theme-color" content="#004aad" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {

        theme: {
          extend: {
            colors: {
              primary: '#004aad',
              secondary: '#64748b',
              graybg: '#f3f4f6'
            }
          }
        }
      }
    </script>
<style>
  @media print {
    body * {
      visibility: hidden;
    }
    #root {
      visibility: hidden;
    }
    .print-wrapper {
      position: static !important;
      left: auto !important;
      top: auto !important;
      z-index: auto !important;
    }
    .print-container, .print-container * {
      visibility: visible;
    }
    .print-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 210mm !important;
      margin: 0;
      padding: 0;
    }
    .page-break {
      page-break-after: always;
      break-after: page;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
  }
</style>
</head>
  <body class="bg-gray-100">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
